<html>

<head>
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1 id="cal">Calculator</h1>
  <div id="container">
    <input type="text/submit/hidden/button/image" name="" id="inp" value="" disabled />

    <div class="btns">
      <button type="submit" class="btn">1</button>
      <button type="submit" class="btn">2</button>
      <button type="submit" class="btn">3</button>
      <button type="submit" class="btn oprator">(</button>
      <button type="submit" class="btn oprator">-</button>
      <button type="submit" class="btn">4</button>
      <button type="submit" class="btn">5</button>
      <button type="submit" class="btn">6</button>
      <button type="submit" class="btn oprator">)</button>
      <button type="submit" class="btn oprator">/</button>
      <button type="submit" class="btn">7</button>
      <button type="submit" class="btn">8</button>
      <button type="submit" class="btn">9</button>
      <button type="submit" class="btn oprator vertLongBtn">*</button>
      <button type="submit" class="btn oprator vertLongBtn">+</button>
      <button type="submit" class="btn">.</button>
      <button type="submit" class="btn">0</button>
      <button type="submit" class="btn">00</button>
      <button type="submit" class="btn del horzLongBtn">del</button>
      <button type="submit" class="btn">AC</button>
      <button type="submit" class="btn equal horzLongBtn">=</button>
    </div>

  </div>

  <script src="script.js" defer></script>
</body>

</html>
